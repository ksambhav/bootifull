services:
  postgresql:
    image: postgres:latest
    environment:
      POSTGRES_DB: bootifull
      POSTGRES_USER: bootifull
      POSTGRES_PASSWORD: bootifull
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootifull -d bootifull"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql

  app:
    build: .
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql:5432/bootifull
      - SPRING_DATASOURCE_USERNAME=bootifull
      - SPRING_DATASOURCE_PASSWORD=bootifull
      - APP_SECURITY_WEBAUTHN_RP_ID=localhost
      - APP_SECURITY_WEBAUTHN_ALLOWED_ORIGINS=http://localhost:8080
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID=change-me
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET=change-me
    ports:
      - "8080:8080"

volumes:
  postgres-data:
